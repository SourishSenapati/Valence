[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-process-sim"
version = "0.1.0"
description = "An open-source, agent-native chemical process simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenSim Contributors" }
]

dependencies = [
    "chemicals>=1.0.0",
    "thermo>=0.2.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_sim"]
